# CI: the pure-test subset. LNG history.xlsx is proprietary market data
# and is NOT in the repo, so the workbook-backed tests (fixtures skip
# gracefully without it -- ~185 of ~385) and the frozen legacy 64/64 suite
# (tests/test_model.py, which requires the workbook outright) can only
# run locally. What CI still guards on every push: all pure-math and
# engine tests (Margrabe closed forms, physical mass balance, emissions
# factors, cost policy, speed/heel/turnaround mechanics, cash-flow layer
# evaluation, quantity-cache behaviour, charter overlay calibration,
# built-in single-day curve (first CI coverage of the strip/decision
# pricing path), exposure-derived hedge legs -- 200 tests), byte-compilation of
# every module, and dependency installability.
name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Byte-compile every module
        run: python -m compileall -q app.py model.py data.py decision.py physical.py emissions.py risk.py spread_option.py cashflows.py hardcoded_curve.py
      - name: Run pure-test subset
        run: python -m pytest tests/ --ignore=tests/test_model.py -q
